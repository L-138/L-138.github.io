<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>L</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #222 url("./imagen.png") center / cover no-repeat fixed;
            font-family: system-ui, sans-serif;
        }

        .imagen-superior {
            position: fixed;
            top: 32px;
            left: 32px;
            width: clamp(280px, 44vw, 560px);
            max-height: 35vh;
            height: auto;
            object-fit: contain;
            object-position: top left;
            z-index: 10;
        }

        .contenedor {
            display: flex;
            width: min(600px, 100%);
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px 18px;
            border: 2px solid #444;
            border-radius: 10px;
            background: #ccc;
            color: #222;
            font: inherit;
            outline: none;
            box-shadow: 0 8px 28px rgb(0 0 0 / 30%);
        }

        input:focus {
            outline: 2px solid #888;
        }

        button {
            width: 54px;
            min-width: 54px;
            border: 2px solid #444;
            border-radius: 10px;
            background: #ccc;
            cursor: pointer;
            box-shadow: 0 8px 28px rgb(0 0 0 / 30%);
        }

        button:hover {
            background: #bbb;
        }
        @media (max-width: 480px) {
    body {
        padding: 16px;
        background-attachment: scroll;
    }
    
    .imagen-superior {
        top: 24px;
        left: 24px;
        width: 70vw;
        max-width: 360px;
        max-height: 30vh;
    }

    .contenedor {
        gap: 8px;
    }

    input {
        padding: 12px;
        font-size: 16px;
    }

    button {
        width: 48px;
        min-width: 48px;
    }
}
    </style>
</head>
<body>

    <img src="./text.png" alt="" class="imagen-superior" >

    <form class="contenedor" id="formulario">
        <input
            type="text"
            id="codigo"
            aria-label="Código"
            maxlength="6"
            inputmode="numeric"
            pattern="[0-9]{6}"
            autocomplete="off"
            required
        >

        <button type="submit" aria-label="Enviar"></button>
    </form>

    <script>
        const formulario = document.getElementById("formulario");
        const codigo = document.getElementById("codigo");

        codigo.addEventListener("input", () => {
            codigo.value = codigo.value.replace(/\D/g, "").slice(0, 6);
        });

        formulario.addEventListener("submit", (evento) => {
            evento.preventDefault();

            if (!/^\d{6}$/.test(codigo.value)) {
                alert("Introduce un código de 6 dígitos.");
                return;
            }

            if (codigo.value === "123456") {
                alert("felicitaciones");
            } else {
                alert("Código incorrecto.");
            }
        });
    </script>

</body>
</html>
